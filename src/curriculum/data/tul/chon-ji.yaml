# Chon-Ji — first tul in ITF Taekwon-Do
# Source: ITF Encyclopedia (Choi Hong Hi, 1999, p.41); TAGB syllabus
id: chon-ji
name: Chon-Ji
koreanName: 천지
movements: 19
beltLevelId: 10th-kup
meaning: >
  Chon-Ji means literally "the Heaven the Earth". In the Orient it is interpreted
  as the creation of the world or the beginning of human history, hence it is the
  initial pattern played by the beginner. This pattern consists of two similar
  parts; one to represent the Heaven and the other the Earth.
source: "ITF Encyclopedia (Choi Hong Hi, 1999, p.41); TAGB syllabus (tagb.co.uk)"
