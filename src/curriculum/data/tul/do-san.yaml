# Do-San — second tul in ITF Taekwon-Do (9th kup)
# Source: ITF Encyclopedia (Choi Hong Hi, 1999, p.57); TAGB syllabus (tagb.co.uk)
id: do-san
name: Do-San
koreanName: 도산
movements: 28
beltLevelId: 9th-kup
meaning: >
  Do-San is the pseudonym of the patriot Ahn Chang-Ho (1876–1938)
  who devoted his entire life to furthering the education of Korea
  and its independence movement.
source: "ITF Encyclopedia (Choi Hong Hi, 1999, p.57); TAGB syllabus (tagb.co.uk)"
