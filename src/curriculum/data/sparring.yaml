# One-step sparring (Il-Su Sik 일수식) — 10th kup grading
# Basic pre-arranged sequences: attacker announces "Attack!" (Kongkyok!), then steps in.
# Source: HED TKD school syllabus; standard TAGB/ITF il-su sik methodology.
# Note: exact school variations should be verified against HED TKD grading sheet.

oneStepSparring:
  - id: il-su-sik-1
    number: 1
    attack: >
      Step back with the right foot into left walking stance, execute left low
      outer forearm block; then step forward with the right foot delivering a right
      obverse punch (Kaunde Baro Jirugi) to the middle section.
    defence: >
      Step to the right with the right foot into right walking stance; execute
      left low outer forearm block to deflect the incoming punch; counter with
      right obverse punch to the solar plexus.
    beltLevelId: 10th-kup
    source: "HED TKD school syllabus; TAGB il-su sik methodology"

  - id: il-su-sik-2
    number: 2
    attack: >
      Step back with the left foot into right walking stance, execute right low
      outer forearm block; then step forward with the left foot delivering a left
      obverse punch to the middle section.
    defence: >
      Step to the left with the left foot into left walking stance; execute right
      low outer forearm block to deflect; counter with left obverse punch to the
      solar plexus.
    beltLevelId: 10th-kup
    source: "HED TKD school syllabus; TAGB il-su sik methodology"

  - id: il-su-sik-3
    number: 3
    attack: >
      Step back with the right foot into left walking stance, execute left low
      outer forearm block; then step forward with the right foot delivering a right
      obverse punch to the middle section.
    defence: >
      Step to the right with the right foot into right walking stance; execute
      left low outer forearm block to deflect; counter with a right front snap kick
      (Apcha Busigi) to the attacker's abdomen.
    beltLevelId: 10th-kup
    source: "HED TKD school syllabus; TAGB il-su sik methodology"

# ── 9th kup (white belt with yellow tag) ────────────────────────────────────
# Patterns 4–6. Introduces the high block and side kick from Do-San.
# Note: school-specific step order should be verified against HED TKD grading sheet.
# Source: HED TKD school syllabus; TAGB il-su sik methodology.

  - id: il-su-sik-4
    number: 4
    attack: >
      Step forward with the right foot into right walking stance; execute a right
      high-section obverse punch (Nopunde Baro Jirugi) to the head.
    defence: >
      Step back with the left foot into left L-stance; execute a right high outer
      forearm block (Nopunde Bakat Palmok Makgi) to deflect the punch;
      counter with a left middle reverse punch (Kaunde Bandae Jirugi) to the solar plexus.
    beltLevelId: 9th-kup
    source: "HED TKD school syllabus; TAGB il-su sik methodology"

  - id: il-su-sik-5
    number: 5
    attack: >
      Step forward with the left foot into left walking stance; execute a left
      obverse punch (Kaunde Baro Jirugi) to the middle section.
    defence: >
      Step back with the right foot into right L-stance; execute a left high outer
      forearm block to deflect upward; counter with a right side piercing kick
      (Yop Cha Jirugi) to the attacker's ribs.
    beltLevelId: 9th-kup
    source: "HED TKD school syllabus; TAGB il-su sik methodology"

  - id: il-su-sik-6
    number: 6
    attack: >
      Step forward with the right foot into right walking stance; execute a right
      obverse punch to the middle section.
    defence: >
      Step to the right with the right foot into right walking stance; execute
      a left low outer forearm block to deflect; counter with a right obverse punch
      to the solar plexus followed immediately by a left reverse punch to the face.
    beltLevelId: 9th-kup
    source: "HED TKD school syllabus; TAGB il-su sik methodology"
